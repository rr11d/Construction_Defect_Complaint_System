services:
  db:
    image: mysql:8.0
    container_name: construction-defect-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: construction_defect
      MYSQL_USER: complaint_app
      MYSQL_PASSWORD: complaint_app_pw
      MYSQL_ROOT_PASSWORD: root_pw
    ports:
      - "3307:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pw"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

